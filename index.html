<body>

    <h1>Hello World!</h1>

    <h2>Disciplina de Programação</h2>

    <label>Digite seu nome:</label>
    <input type="text" id="nome">

    <h3>Digite suas notas:</h3>

    <input type="number" id="nota1" placeholder="Nota 1">
    <input type="number" id="nota2" placeholder="Nota 2">
    <input type="number" id="nota3" placeholder="Nota 3">
    <input type="number" id="nota4" placeholder="Nota 4">

    <br><br>

    <button onclick="calcularMedia()">Calcular Média</button>

    <h3 id="resultado"></h3>

    <script>
        function calcularMedia() {
            let nome = document.getElementById("nome").value;

            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let nota3 = Number(document.getElementById("nota3").value);
            let nota4 = Number(document.getElementById("nota4").value);

            let media = (nota1 + nota2 + nota3 + nota4) / 4;

            let situacao;

            if (media >= 7) {
                situacao = "Aprovado";
            } else {
                situacao = "Reprovado";
            }

            document.getElementById("resultado").innerHTML =
                "Olá " + nome + "! Sua média é " + media.toFixed(2) +
                "<br>Situação: " + situacao;
        }
    </script>

</body>
</html>
