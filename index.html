<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal do Aluno</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #cbd5e1;
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 35px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.4);
        }

        .notas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .notas input {
            width: 100%;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: rgba(15, 23, 42, 0.65);
            display: none;
        }

        .resultado h2 {
            margin-bottom: 10px;
            color: #a5b4fc;
        }

        .media {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .aprovado {
            color: #4ade80;
            font-weight: bold;
            font-size: 20px;
        }

        .reprovado {
            color: #f87171;
            font-weight: bold;
            font-size: 20px;
        }

        .rodape {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px;
            }

            .titulo h1 {
                font-size: 30px;
            }

            .notas {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="titulo">
            <h1>🎓 Portal do Aluno</h1>
            <p>Disciplina de Programação</p>
        </div>

        <div class="card">

            <div class="campo">
                <label for="nome">👤 Nome do aluno</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label>📝 Digite suas notas</label>

                <div class="notas">
                    <input type="number" id="nota1" placeholder="Nota 1" min="0" max="10">
                    <input type="number" id="nota2" placeholder="Nota 2" min="0" max="10">
                    <input type="number" id="nota3" placeholder="Nota 3" min="0" max="10">
                    <input type="number" id="nota4" placeholder="Nota 4" min="0" max="10">
                </div>
            </div>

            <button onclick="calcularMedia()">
                🚀 Calcular Média
            </button>

            <div class="resultado" id="resultado">
                <h2>Resultado</h2>

                <p id="mensagem"></p>

                <div class="media" id="media"></div>

                <div id="situacao"></div>
            </div>

        </div>

        <div class="rodape">
            Projeto desenvolvido para a disciplina de Programação
        </div>

    </div>


    <script>

        function calcularMedia() {

            let nome = document.getElementById("nome").value;

            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let nota3 = Number(document.getElementById("nota3").value);
            let nota4 = Number(document.getElementById("nota4").value);

            if (nome === "" || isNaN(nota1) || isNaN(nota2) ||
                isNaN(nota3) || isNaN(nota4)) {

                alert("Preencha seu nome e todas as notas!");
                return;
            }

            let media = (nota1 + nota2 + nota3 + nota4) / 4;

            let situacao;
            let classe;

            if (media >= 7) {
                situacao = "✅ APROVADO";
                classe = "aprovado";
            } else {
                situacao = "❌ REPROVADO";
                classe = "reprovado";
            }

            document.getElementById("mensagem").innerHTML =
                "Olá, <strong>" + nome + "</strong>!";

            document.getElementById("media").innerHTML =
                media.toFixed(2);

            document.getElementById("situacao").innerHTML =
                "<span class='" + classe + "'>" + situacao + "</span>";

            document.getElementById("resultado").style.display = "block";
        }

    </script>

</body>

</html>
